# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Pacman

permissions:
  contents: write

# The sequence of runs in this workflow:
on:
  # Run on pushes to main (commits)
  push:
    branches:
      - main
  # Run on other activity so the contribution graphic updates quickly
  pull_request:
  issues:
  issue_comment:
  pull_request_review:
  release:
  watch:
  workflow_dispatch:
  # Fallback schedule: every 5 minutes for near-real-time updates
  schedule:
    - cron: "*/5 * * * *"

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
    
      - name: Generate the pacman files in './dist/'
        uses: Platane/snk@v3
        id: generate-pacman
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman.svg?type=pacman&color_snake=%23FF0000&color_dots=%2300FF00,%23FFFF00,%230000FF&color_empty=%230d1117
            dist/pacman-dark.svg?type=pacman&palette=github-dark&color_snake=%23FF0000&color_dots=%2300FF00,%23FFFF00,%230000FF&color_empty=%230d1117
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}